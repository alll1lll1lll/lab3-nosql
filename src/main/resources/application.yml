spring:
  application:
    name: university-booking

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  data:
    mongodb:
      uri: mongodb://localhost:27017/booking?directConnection=true
      auto-index-creation: false

    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis

server:
  port: 8080
  error:
    include-message: always

app:
  cart:
    ttl-seconds: 900
  rate-limit:
    requests-per-minute: 60
  analytics:
    cache-ttl-seconds: 60
  cassandra:
    contact-points: 127.0.0.1:9042,127.0.0.1:9043,127.0.0.1:9044
    local-datacenter: dc1
    keyspace: booking_events
    replication-factor: 3
    consistency: LOCAL_QUORUM
    request-timeout: 5s
    bucket-size: 100000
    reconnect-interval: 10s

logging:
  level:
    com.university.booking: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    com.datastax.oss.driver: INFO
  structured:
    format:
      console: logstash