name: lab3-nosql

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: lab3-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --save 300 10
      --notify-keyspace-events KEA
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    container_name: lab3-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  cassandra-1: &cassandra
    image: cassandra:5.0
    container_name: cassandra-1
    hostname: cassandra-1
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment: &cassandra-env
      CASSANDRA_CLUSTER_NAME: booking-cluster
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 128M
      JVM_EXTRA_OPTS: -Dcassandra.skip_wait_for_gossip_to_settle=0
      NATIVE_PORT: 9042
    command:
      - bash
      - -c
      - >-
        sed -i
        -e "s/^native_transport_port: .*/native_transport_port: $${NATIVE_PORT}/"
        -e "s/^# partition_size_warn_threshold:.*/partition_size_warn_threshold: 10MiB/"
        /etc/cassandra/cassandra.yaml
        && exec docker-entrypoint.sh cassandra -f
    ports:
      - "9042:9042"
    volumes:
      - cassandra-1-data:/var/lib/cassandra
    networks:
      cassandra-net:
        ipv4_address: 172.30.0.11
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 $${NATIVE_PORT} -e 'SELECT release_version FROM system.local' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  cassandra-2:
    <<: *cassandra
    container_name: cassandra-2
    hostname: cassandra-2
    environment:
      <<: *cassandra-env
      CASSANDRA_RACK: rack2
      NATIVE_PORT: 9043
    ports:
      - "9043:9043"
    volumes:
      - cassandra-2-data:/var/lib/cassandra
    networks:
      cassandra-net:
        ipv4_address: 172.30.0.12
    depends_on:
      cassandra-1:
        condition: service_healthy

  cassandra-3:
    <<: *cassandra
    container_name: cassandra-3
    hostname: cassandra-3
    environment:
      <<: *cassandra-env
      CASSANDRA_RACK: rack3
      NATIVE_PORT: 9044
    ports:
      - "9044:9044"
    volumes:
      - cassandra-3-data:/var/lib/cassandra
    networks:
      cassandra-net:
        ipv4_address: 172.30.0.13
    depends_on:
      cassandra-2:
        condition: service_healthy

networks:
  cassandra-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
  mongo-data:
  cassandra-1-data:
  cassandra-2-data:
  cassandra-3-data:
